version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-dependencies:
        patterns: ["*"]

  # The docker submodule is its own Go module, so it needs its own entry:
  # the root directory above covers only the core module's go.mod, which is
  # why the submodule's dependencies raised alerts but never an update.
  - package-ecosystem: gomod
    directory: /docker
    schedule:
      interval: weekly
    # The moby client is pre-1.0 and has changed call shapes and its
    # minimum API version between minor releases, so its bumps get a pull
    # request of their own: a breaking one inside the catch-all group would
    # turn the whole pull request red and hold back unrelated updates.
    groups:
      go-dependencies:
        patterns: ["*"]
        exclude-patterns: ["github.com/moby/moby/*"]
      moby:
        patterns: ["github.com/moby/moby/*"]
    ignore:
      # The core module is pinned to a released version by hand and
      # repointed only at release time (see RELEASING.md). An automated
      # bump here would propose a version that does not exist yet and
      # collide with that process.
      - dependency-name: "github.com/ruffel/invoke"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
