# Release Drafter keeps a draft release current as pull requests merge, so
# cutting a release is publishing something already written rather than
# recalling what changed.
#
# The draft is a starting point rather than the finished notes. It groups by
# the kind of change, and a release worth reading groups by theme and says
# why each change mattered, which no generator does. Edit before
# publishing, and just before it: every push to main redrafts the notes.
#
# Every rule below lives on a category, which is the one schema v7 is not
# deprecating: a category says what it is (type), what it collects (when),
# and what it does to the version (semver-increment). The older spellings —
# categories[*].labels, exclude-labels, version-resolver — warn on every
# run and are documented as going away, so none is used.

name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

categories:
  # Dropped before anything else looks at it.
  - type: pre-exclude
    when:
      labels: ['skip-changelog']

  # A breaking change raises the minor rather than the major. On a v1
  # module it is a change callers have to act on, a raised requirement or
  # a relied-on behaviour; one that breaks their code compiling needs a
  # new major and a new module path, which no label can produce, so no
  # category says "major". semver-increment is deliberately absent
  # everywhere it would say "patch", which is its default; naming it only
  # where a category lifts the version keeps the two that do visible.
  - title: 'Breaking changes'
    when:
      labels: ['breaking']
    semver-increment: minor
  - title: 'Security'
    when:
      labels: ['security']
  - title: 'Features'
    when:
      labels: ['feature']
    semver-increment: minor
  - title: 'Fixes'
    when:
      labels: ['fix']
  - title: 'Contracts and tests'
    when:
      labels: ['test']
  - title: 'Documentation'
    when:
      labels: ['documentation']
  - title: 'Build and CI'
    when:
      labels: ['chore']

change-template: '- $TITLE (#$NUMBER)'

# A title carrying markdown of its own would otherwise render as markdown.
change-title-escapes: '\<*_&'

# A pull request matching no category at all resolves the version by the
# schema's own default, which is patch.
#
# The labels themselves are applied from the pull request title by
# .github/pr-label.sh, which the workflow runs on every pull request. They
# are not applied from here: release drafter's own autolabeler writes no
# labels from v7, which runs in dry-run mode whenever the ref is a pull
# request's ephemeral merge commit, so an autolabeler block here would be
# configuration that silently does nothing.
#
# A breaking change carries the Conventional Commits "!" marker, as in
# "fix(fake)!: ...". That marker and a feature are the only things that
# raise the minor: a breaking change titled without it drafts as a patch.
# The convention is stated in CONTRIBUTING.md.

template: |
  $CHANGES

  **Full changelog**: https://github.com/$OWNER/$REPOSITORY/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
